<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfilaí: meus planos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23b46bff'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/></svg>">
<link rel="stylesheet" href="/s/base.css"><link rel="stylesheet" href="/s/app.css">
</head>
<body>
<header class="topo"><div class="w topo-c">
  <a class="marca" href="/app"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg></i>Perfil<span>aí</span></a>
  <nav><span id="cota" class="cota"></span><button class="btn btn-sec" onclick="SBTour.abrir()">Tour</button><button class="btn btn-sec" id="sair">Sair</button></nav>
</div></header>

<main class="w">
  <section class="painel-novo" id="novo">
    <h1>Novo plano de perfil</h1>
    <p class="sub-p">Quanto mais você contar, melhor o plano. O print é opcional, mas deixa o raio-x muito mais certeiro.</p>
    <div id="sem-plano" hidden class="aviso">Você ainda não tem um plano ativo. <a href="/#preco">Ver planos</a></div>
    <form id="f-plano" class="form">
      <div class="dois"><div><label for="arroba">@ do perfil</label><input id="arroba" required placeholder="@seuperfil" autocomplete="off"></div>
        <div><label for="nicho">Nicho</label><input id="nicho" placeholder="Ex.: confeitaria, estética, advocacia"></div></div>
      <label for="objetivo">O que você quer com o Instagram?</label><textarea id="objetivo" rows="2" required maxlength="300" placeholder="Ex.: vender meu curso de bolo no pote para mulheres que querem renda extra"></textarea>
      <div class="dois"><div><label for="produto">Produto ou serviço</label><input id="produto" maxlength="200" placeholder="Ex.: curso online de R$ 97"></div>
        <div><label for="cor">Cor da marca</label><input id="cor" type="color" value="#b46bff" class="cor"></div></div>
      <label>Prints do perfil (até 3)</label>
      <label class="soltar" for="prints"><input id="prints" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
        <strong>Escolher prints</strong><span>Print da tela do perfil com a bio e os posts. PNG ou JPG.</span></label>
      <div class="previas" id="previas"></div>
      <button class="btn btn-pri grande" type="submit" id="b-gerar">Gerar meu plano</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </section>

  <section class="lista-planos">
    <h2>Meus planos</h2>
    <div id="planos"></div>
  </section>
</main>

<div class="folha" id="folha" hidden role="dialog" aria-modal="true"><div class="folha-c"><button class="x" data-fechar aria-label="Fechar">×</button><div id="folha-corpo"></div></div></div>
<div class="toast" id="toast" hidden></div>
<script src="/s/app.js"></script>
<script>window.TOUR = { chave: 'perfilai.tour1', atraso: 1500, passos: [
  { titulo: 'Bem-vindo ao Perfilaí', texto: 'Em 1 minuto: você manda o @ e um print, e a IA monta o plano completo do seu Instagram.' },
  { alvo: '#arroba', titulo: 'Seu @', texto: 'O perfil que vai receber o plano. Não pedimos senha, nunca.' },
  { alvo: '#objetivo', titulo: 'O seu objetivo', texto: 'Diga o que você vende e para quem. É daqui que sai a estratégia, as bios e o site.' },
  { alvo: '.soltar', titulo: 'Prints do perfil', texto: 'Tire print da tela do perfil (bio e posts). A IA lê e faz o raio-x do que já existe.' },
  { alvo: '#b-gerar', titulo: 'Gerar', texto: 'A IA diretora define a estratégia e a redatora escreve tudo. Leva alguns minutos; avisamos por e-mail.' },
  { alvo: '#planos', titulo: 'Seus planos', texto: 'Abra um plano para ver raio-x, bios, 30 ideias, roteiros, stories, carrosséis e baixar o site de vendas.' },
  { alvo: '#cota', titulo: 'Seu plano', texto: 'Quantos planos você ainda tem no mês. Para ver este tour de novo, clique em Tour.' },
] }</script>
<script src="/s/tour.js"></script>
</body>
</html>
